name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g. v2.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('**/*.gradle.kts') }}

      - uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-release-${{ hashFiles('.github/scripts/build-llama-server.sh') }}-v7

      - name: Build llama-server
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash .github/scripts/build-llama-server.sh

      - name: Download Vosk model
        run: bash .github/scripts/download-vosk-model.sh

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then exit 0; fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.jks

      - name: Create key.properties
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_PASS" ]; then
            cat > key.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          fi

      - name: Setup Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.7; fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/app-release*.apk \
             artifacts/llmcar-${VERSION}-arm64.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: LLM Car Shell ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
