name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Setup NDK r26b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false
          link-to-sdk: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-Linux-v3-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.kt', '**/*.xml') }}
          restore-keys: |
            gradle-Linux-v3-

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-${{ hashFiles('.github/scripts/build-llama-server.sh') }}-v7

      - name: Build llama-server
        run: bash .github/scripts/build-llama-server.sh

      - name: Download Vosk model
        run: bash .github/scripts/download-vosk-model.sh

      # Gradle 9.8 на раннере требует settings.gradle(.kts) в рабочей
      # директории, поэтому создаём пустой файл во временной папке.
      - name: Setup Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            TMPDIR=$(mktemp -d)
            touch "$TMPDIR/settings.gradle.kts"
            (cd "$TMPDIR" && gradle wrapper --gradle-version 8.7 --distribution-type bin)
            cp "$TMPDIR/gradlew" .
            [ -f "$TMPDIR/gradlew.bat" ] && cp "$TMPDIR/gradlew.bat" .
            cp -r "$TMPDIR/gradle" .
            rm -rf "$TMPDIR"
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LlmCarShell-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
